name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    name: Unit tests + generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
  browser:
    name: Browser run (TV + GM + 4 phones)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser
      - run: node test/browser/lab.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: browser-shots, path: test/shots, if-no-files-found: ignore }
  bots:
    name: Bot runs (4 and 8 bots, every mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:bots
